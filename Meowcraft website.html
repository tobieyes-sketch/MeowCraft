<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Meowcraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#141a26;--mut:#667089;--ac:#2fb457;--ln:#d5dae5;--nav:#e9edf5;--wa:#f5a524}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b101a;--card:#121926;--tx:#e8ecf5;--mut:#8b95ad;--ln:#26304a;--nav:#0d1320}}
:root[data-theme="dark"]{--bg:#0b101a;--card:#121926;--tx:#e8ecf5;--mut:#8b95ad;--ln:#26304a;--nav:#0d1320}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}a{color:inherit}
nav{display:flex;gap:16px;align-items:center;padding:10px 18px;background:var(--nav);flex-wrap:wrap;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav a.l{color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.5px}nav a.on{color:var(--ac)}
.sp{flex:1}input,textarea,select{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;width:100%}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.s{padding:5px 10px;font-size:12px}.btn.d{background:#e5484d}
.hero{padding:44px 20px;text-align:center;background:linear-gradient(180deg,#e8864a,#6b4a8c 50%,#1d3a2a);color:#fff}
.lg{display:block;max-width:100%;height:auto;margin:0 auto}.hero p{margin:6px 0}
.wrap{max-width:960px;margin:0 auto;padding:20px}.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.grid .card{margin:0}.mut{color:var(--mut);font-size:13px}
.auth{max-width:360px;margin:7vh auto;padding:20px}.form{display:grid;gap:10px}.err{color:#e5484d;font-size:13px;min-height:16px}
.tag{background:var(--ac);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-right:4px}.tag.b{background:var(--wa)}.tag.m{background:#6b5bd6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.stats .card{margin:0;text-align:center}.stats b{font-size:26px;display:block}
.bar{background:var(--wa);color:#231;padding:10px 16px;text-align:center;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chips button{border-radius:20px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes drift{50%{background-position:0 100%}}
@keyframes rise{to{transform:translateY(-460px) rotate(120deg);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,180,87,.65)}70%{box-shadow:0 0 0 16px rgba(47,180,87,0)}100%{box-shadow:0 0 0 0 rgba(47,180,87,0)}}
@keyframes pop{40%{transform:scale(1.35)}}
body,nav,input,textarea,select{transition:background-color .35s,color .35s,border-color .35s}
.card{transition:transform .22s,box-shadow .22s,border-color .22s,background-color .35s}
.grid .card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(0,0,0,.22);border-color:var(--ac)}
.btn{transition:transform .15s,filter .15s,background-color .2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active{transform:scale(.95)}
nav a.l{position:relative;padding:4px 0}nav a.l::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transition:transform .25s}
nav a.l:hover::after,nav a.on::after{transform:scaleX(1)}
.bar{animation:drop .5s both}.auth{animation:up .6s both}.auth .lg{animation:fl 4s ease-in-out infinite}
.hero{position:relative;overflow:hidden;background-size:100% 220%;animation:drift 12s ease-in-out infinite}
.hero>*:not(.px){position:relative}.hero .lg{animation:fl 4s ease-in-out infinite}
.hero .btn{animation:pulse 2.2s infinite}
.px{position:absolute;bottom:-24px;width:var(--s);height:var(--s);background:rgba(255,255,255,.35);animation:rise var(--d) linear infinite}
#pg.in>*,#pg.in .grid .card,#pg.in .stats .card,#pg.in .wrap>.card{animation:up .5s both;animation-delay:calc(var(--i,0)*70ms)}
#pg.in .hero{animation:none}.tag{transition:transform .2s}.card:hover .tag{transform:scale(1.08)}
button[data-a=like]:active{animation:pop .3s}
.vr{background:var(--card);border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;transition:border-color .2s,background-color .35s}
.vr:hover{border-color:var(--ac)}.vh{padding:6px 12px;cursor:pointer;gap:8px}.vh b{font-size:15px}.vh .mut{font-size:12px}
.vb{padding:8px 14px 12px;border-top:1px solid var(--ln);white-space:pre-wrap;font-size:13px;animation:up .25s both}
.car{color:var(--mut);transition:transform .2s;font-size:12px}.vr.open .car{transform:rotate(180deg)}
.tag.n{background:#2f7be5}.tag.d{background:#777}.card.row{padding:8px 14px;margin-bottom:6px}
label.mut{display:block;margin-bottom:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let db=null,assets=null,me=null,users={},items=[],cfg={note:''},page='home',q='',chan='all',cat='all',tab='pub',mode='login',fails=0,lock=0;
const isA=()=>me&&me.role==='admin',vis=i=>!i.draft||isA(),vers=()=>items.filter(i=>i.type==='ver'&&vis(i)),of=t=>items.filter(i=>i.type===t&&vis(i));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
async function load(){
  users=L.get('mc_users')||{};items=L.get('mc_items')||[];cfg=L.get('mc_cfg')||cfg;
  if(db)try{const u=await db.collection('users').get(),v=await db.collection('items').get();
    u.forEach(d=>users[d.id]=d.data());items=[];v.forEach(d=>{const x=d.data();x.id==='cfg'?cfg=x:items.push(x)})}catch(e){}
  /* migrate versions saved by the first release */
  let old=L.get('mc_versions')||[];
  if(db)try{const o=await db.collection('versions').get();o.forEach(d=>old.push(d.data()))}catch(e){}
  const mig=[];
  for(const v of old){if(!v||!v.ver||items.some(i=>i.id===v.id))continue;
    const it={id:v.id||'ver'+Date.now()+mig.length,type:'ver',title:v.ver,notes:v.notes||'',url:v.url,size:v.size||'—',date:v.date||'',channel:'stable',dl:0,likes:[],by:'TobiEyes'};
    items.push(it);mig.push(it)}
  if(mig.length){persist();if(db)for(const it of mig)try{await db.doc('items/'+it.id).set(it)}catch(e){}}
  users[ADMIN.name.toLowerCase()]={name:ADMIN.name,hash:ADMIN.hash,role:'admin'};sort()}
const sort=()=>items.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));
const persist=()=>{L.set('mc_users',users);L.set('mc_items',items);L.set('mc_cfg',cfg)};
async function put(c,id,o){persist();if(db)try{await db.doc(c+'/'+id).set(o)}catch(e){}}
async function rm(c,id){persist();if(db)try{await db.doc(c+'/'+id).delete()}catch(e){}}
/* ---------- auth ---------- */
function authView(msg=''){
  app.innerHTML=`<div class="auth"><img class="lg" width="300" src="${LOGO}" alt="Meowcraft">
  <p class="mut" style="text-align:center">${mode=='login'?'Log in to continue':'Create your account'}</p>
  <div class="card form"><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
  ${mode=='signup'?'<input id="p2" type="password" placeholder="Confirm password">':''}<div class="err" id="e">${esc(msg)}</div>
  <button class="btn" id="go">${mode=='login'?'Log in':'Sign up'}</button><button class="btn g" id="sw">${mode=='login'?'New here? Sign up':'Have an account? Log in'}</button></div></div>`;
  $('#sw').onclick=()=>{mode=mode=='login'?'signup':'login';authView()};
  const E=m=>$('#e').textContent=m;
  $('#go').onclick=async()=>{
    const un=$('#u').value.trim(),pw=$('#p').value,k=un.toLowerCase();
    if(Date.now()<lock)return E('Too many attempts. Wait '+Math.ceil((lock-Date.now())/1000)+'s');
    if(!un||!pw)return E('Enter username and password');
    const h=await hash(un,pw);
    if(mode=='login'){const u=users[k];if(!u||u.hash!==h){if(++fails>=5){lock=Date.now()+30000;fails=0}return E('Wrong username or password')}me=u}
    else{if(!/^[\w.-]{3,20}$/.test(un))return E('Username: 3-20 letters, numbers, . _ -');if(pw.length<6)return E('Password must be 6+ characters');
      if(pw!==$('#p2').value)return E("Passwords don't match");if(users[k])return E('Username taken');
      me={name:un,hash:h,role:'user',joined:new Date().toISOString().slice(0,10)};users[k]=me;await put('users',k,me)}
    L.set('mc_me',k);fails=0;shell();toast('Welcome, '+me.name+' 🐱')};
}

const byId=id=>items.find(i=>i.id===id);
const A={
 chan:id=>{chan=id;view();replay()},cat:id=>{cat=id;view();replay()},tab:id=>{tab=id;view();replay()},
 dl:async id=>{const i=byId(id);i.dl=(i.dl||0)+1;await put('items',id,i);setTimeout(view,300)},
 like:async id=>{const i=byId(id),l=i.likes=i.likes||[],k=l.indexOf(me.name);k<0?l.push(me.name):l.splice(k,1);await put('items',id,i);view()},
 del:async id=>{if(!confirm('Delete this item?'))return;items=items.filter(i=>i.id!==id);await rm('items',id);view();toast('Deleted')},
 edit:id=>{editId=id;ret=page;go('edit')},
 back:()=>go(ret||'versions'),
 tog:id=>{open[id]=!open[id];view()},
 expall:()=>{vers().forEach(i=>open[i.id]=1);view()},
 colall:()=>{open={};view()},
 vsort:id=>{vsort=id;view()},
 copy:async id=>{const i=byId(id);try{await navigator.clipboard.writeText(i.url);toast('Link copied')}catch(e){toast('Copy failed')}},
 delcur:async()=>{if(!confirm('Delete this item permanently?'))return;items=items.filter(i=>i.id!==editId);await rm('items',editId);toast('Deleted');A.back()},
 save:async()=>{const i=byId(editId),E=x=>$('#ee').textContent=x,t=$('#et').value.trim();if(!t)return E('Title required');
   const f=$('#ef').files[0];let url=$('#eu').value.trim(),size=$('#es').value.trim()||'—';
   if(f){if(!assets)return E('File hosting unavailable — paste a link instead');$('#sv').disabled=true;E('Uploading…');
     try{url=(await assets.upload(f)).url;size=(f.size/1048576).toFixed(1)+' MB'}catch(e){$('#sv').disabled=false;return E('Upload failed: '+(e.message||e.code||'error'))}}
   if(i.type==='ver'&&!url){$('#sv').disabled=false;return E('A version needs a download link')}
   Object.assign(i,{title:t,date:$('#ed').value||i.date,notes:$('#en').value,url,size,draft:$('#edr').checked});
   if(i.type==='ver')i.channel=$('#ec').value;else i.cat=$('#ea').value.trim();
   sort();await put('items',i.id,i);toast('Saved ✓');A.back()},
 role:async k=>{users[k].role=users[k].role=='admin'?'user':'admin';await put('users',k,users[k]);view()},
 udel:async k=>{if(!confirm('Remove this user?'))return;delete users[k];await rm('users',k);view()},
 note:async()=>{cfg={id:'cfg',note:$('#an').value.trim()};await put('items','cfg',cfg);shell();toast('Banner saved')},
 exp:()=>{$('#bk').value=JSON.stringify({users,items,cfg})},
 imp:async()=>{try{const d=JSON.parse($('#bk').value);if(!d.items)throw 0;users={...users,...(d.users||{})};users[ADMIN.name.toLowerCase()].hash=ADMIN.hash;items=d.items;cfg=d.cfg||cfg;persist();
   if(db){for(const i of items)await put('items',i.id,i);for(const k in users)await put('users',k,users[k])}view();toast('Imported')}catch(e){toast('Invalid backup')}},
 pw:async()=>{const p=$('#np').value;if(p.length<6)return $('#pe').textContent='6+ characters';me.hash=await hash(me.name,p);await put('users',me.name.toLowerCase(),me);$('#np').value='';toast('Password changed')},
 pub:async()=>{const E=x=>$('#ae').textContent=x,ty=$('#ty').value,ti=$('#ti').value.trim(),f=$('#fi').files[0];let url=$('#ur').value.trim(),size='—';
   if(!ti)return E('Title / version required');if(ty=='ver'&&!f&&!url)return E('Add a file or link for a version');
   $('#pb').disabled=true;E('Publishing…');
   if(f){size=(f.size/1048576).toFixed(1)+' MB';if(!assets){$('#pb').disabled=false;return E('File hosting unavailable — paste a link instead')}
     try{url=(await assets.upload(f)).url}catch(e){$('#pb').disabled=false;return E('Upload failed: '+(e.message||e.code||'error'))}}
   const it={id:ty+Date.now(),type:ty,title:ti,notes:$('#no').value,url,size,date:new Date().toISOString().slice(0,10),channel:$('#ch').value,cat:$('#ca').value.trim(),dl:0,likes:[],draft:$('#dr').checked,by:me.name};
   items.unshift(it);sort();await put('items',it.id,it);tab='man';view();toast('Published ✓')}
